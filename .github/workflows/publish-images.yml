name: Publish images

# Publishing is driven by tags so that what lands on Docker Hub is always a
# commit someone deliberately marked as a release. Pushing to main does not
# publish, which keeps `latest` from moving under installed launchers on every
# merge.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: omaraflak/kayak
            dockerfile: Dockerfile
            cache: server
          - image: omaraflak/kayak-sandbox
            dockerfile: Dockerfile.sandbox
            cache: sandbox

    steps:
      - uses: actions/checkout@v4

      # arm64 is emulated rather than built on a native runner. Both images
      # install their Python dependencies from prebuilt aarch64 wheels, so the
      # emulation cost is unpacking rather than compiling.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          # `latest` is what the launcher tracks, so every release moves it.
          # The version tags exist so a specific release can be pinned or
          # rolled back to by hand.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Apple Silicon is a first-class target for the launcher, and an
          # amd64-only image would run there under emulation.
          platforms: linux/amd64,linux/arm64
          push: true
          # Baked in so the running container can report its own version, which
          # it cannot read from the image label it was built with.
          build-args: |
            KAYAK_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          # Stamps org.opencontainers.image.version, which the launcher reads to
          # show a real version number instead of a digest.
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}

  # Old version tags serve no one: launchers track `latest`, and rollbacks only
  # ever reach for the last release or two. Keeping the newest three and
  # deleting the rest on every publish stops the account from accumulating an
  # image per release forever. `latest` and the major.minor tags are never
  # touched -- only full semver tags age out.
  prune:
    name: Prune old version tags
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Delete Docker Hub tags older than the newest three versions
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          KEEP = 3
          REPOS = ["omaraflak/kayak", "omaraflak/kayak-sandbox"]
          FULL_VERSION = re.compile(r"^\d+\.\d+\.\d+$")

          def call(url, method="GET", payload=None, token=None):
              data = json.dumps(payload).encode() if payload is not None else None
              request = urllib.request.Request(url, data=data, method=method)
              request.add_header("Content-Type", "application/json")
              if token:
                  request.add_header("Authorization", f"JWT {token}")
              with urllib.request.urlopen(request) as response:
                  body = response.read().decode()
                  return json.loads(body) if body.strip() else {}

          login = call(
              "https://hub.docker.com/v2/users/login",
              method="POST",
              payload={
                  "username": os.environ["DOCKERHUB_USERNAME"],
                  "password": os.environ["DOCKERHUB_TOKEN"],
              },
          )
          token = login["token"]

          for repo in REPOS:
              tags = []
              url = f"https://hub.docker.com/v2/repositories/{repo}/tags?page_size=100"
              while url:
                  page = call(url, token=token)
                  tags.extend(entry["name"] for entry in page.get("results", []))
                  url = page.get("next")

              versions = sorted(
                  (tag for tag in tags if FULL_VERSION.match(tag)),
                  key=lambda v: tuple(int(part) for part in v.split(".")),
                  reverse=True,
              )
              print(f"{repo}: keeping {versions[:KEEP]}")
              for tag in versions[KEEP:]:
                  try:
                      call(
                          f"https://hub.docker.com/v2/repositories/{repo}/tags/{tag}/",
                          method="DELETE",
                          token=token,
                      )
                      print(f"deleted {repo}:{tag}")
                  except urllib.error.HTTPError as error:
                      if error.code in (401, 403):
                          print(
                              "::error::The Docker Hub token cannot delete tags. "
                              "Regenerate it with Read, Write & Delete permissions "
                              "and update the DOCKERHUB_TOKEN secret (see RELEASING.md)."
                          )
                          sys.exit(1)
                      raise
          PYEOF
