# Runs Kayak from source on Docker Desktop for Mac. The Kayak Launcher does the
# same thing for people who do not want a terminal; it names its container
# `kayak-app`, so the two never collide.
services:
  kayak-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kayak-server
    restart: unless-stopped
    # The server stops its sandbox and model containers on the way down, which
    # does not fit in the daemon's default grace period on every machine.
    stop_grace_period: 30s
    ports:
      # Loopback only: agents get shell access inside this container and, via the
      # mounted Docker socket, control of Docker Desktop. Change to "8000:8000" to
      # expose it on the network, and set KAYAK_AUTH_TOKEN if you do.
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      # Sandboxes and model servers are started as sibling containers.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - KAYAK_HOST=0.0.0.0
      - KAYAK_AUTH_TOKEN=${KAYAK_AUTH_TOKEN:-}
      # Sibling containers are mounted by Mac path, which this container cannot
      # see for itself.
      - KAYAK_HOST_DATA_DIR=${PWD}/data
