services:
  kayak-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kayak-server
    restart: unless-stopped
    ports:
      # Published to loopback only: agents get shell access inside this container and,
      # via the mounted Docker socket, control of the host daemon. Change to
      # "8000:8000" to expose it on the network, and set KAYAK_AUTH_TOKEN if you do.
      - "127.0.0.1:8000:8000"
    volumes:
      # Persistent application data (agents, skills, tools, DB, workspaces)
      - ./data:/app/data
      # Mount Docker socket to allow spawning conversation sandboxes (Docker-out-of-Docker)
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - KAYAK_HOST=0.0.0.0
      - KAYAK_PORT=8000
      # Set to require a shared secret on every API call. Strongly recommended if you
      # change the port binding above to expose Kayak beyond loopback.
      - KAYAK_AUTH_TOKEN=${KAYAK_AUTH_TOKEN:-}
      - KAYAK_CORS_ORIGINS=${KAYAK_CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000,http://localhost:3000,http://127.0.0.1:3000}
      # Provider API keys are deliberately absent: they are entered in the Settings page
      # and stored in data/settings.json, so nothing has to be configured before the
      # first launch and the keys never appear in a process listing or a shell history.
      # Local models (vLLM)
      - KAYAK_VLLM_PORT=${KAYAK_VLLM_PORT:-8001}
      - VLLM_API_BASE=${VLLM_API_BASE:-http://host.docker.internal:8001/v1}
      - KAYAK_SANDBOX_IMAGE=kayak-sandbox:latest
      # Host path propagation for Docker-out-of-Docker sibling mounts on macOS/Linux
      - KAYAK_HOST_DATA_DIR=${KAYAK_HOST_DATA_DIR:-${PWD}/data}
    extra_hosts:
      - "host.docker.internal:host-gateway"
